{% extends "base.html" %}

{% block title %}Error — Quantum Oncology Analytics{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card border-0 shadow-lg p-5 rounded-4">
            <i class="bi bi-exclamation-octagon text-danger display-1 mb-3"></i>
            <h2 class="fw-bold text-dark">An Error Occurred</h2>
            <p class="text-muted lead mb-4">{{ error_message or "An unexpected system error occurred during computational processing." }}</p>
            <div>
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary px-4 me-2">
                    <i class="bi bi-house-door me-1"></i> Return to Dashboard
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-arrow-left me-1"></i> Go Back
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
